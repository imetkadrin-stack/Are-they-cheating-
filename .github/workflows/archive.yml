name: Archive Repository

# This workflow creates a ZIP backup of the repository and uploads it as an artifact.
on:
  # Allow running manually from the Actions tab
  workflow_dispatch:

  # Also run automatically whenever code is pushed to main
  push:
    branches:
      - main

jobs:
  archive:
    name: Build, upload, and publish repository archive
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Keep this on main to match your current setup
          ref: main
          # Pull full history
          fetch-depth: 0

      - name: Create complete ZIP
        run: |
          zip -r ericksonathome.zip . -x ".git/*"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ericksonathome-complete
          path: ericksonathome.zip
          retention-days: 30

      - name: Prepare Pages archive site
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p pages
          cp ericksonathome.zip pages/ericksonathome.zip

          {
            echo '<!doctype html>'
            echo '<html lang="en">'
            echo '  <head>'
            echo '    <meta charset="utf-8">'
            echo '    <meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '    <title>Repository Archive</title>'
            echo '  </head>'
            echo '  <body>'
            echo '    <main>'
            echo '      <h1>Repository Archive</h1>'
            echo '      <p>Download the latest published archive for this repository:</p>'
            echo '      <p><a href="./ericksonathome.zip">ericksonathome.zip</a></p>'
            echo '    </main>'
            echo '  </body>'
            echo '</html>'
          } > pages/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy_pages:
    name: Deploy published archive
    needs: archive
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
