name: Archive Repository

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create complete ZIP
        run: |
          zip -r ericksonathome.zip . -x ".git/*"

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with: 
          name: ericksonathome-complete
          path: ericksonathome.zip
          retention-days: 30
